<article class="room-showcase">
  <header>
    <h1>{{roomTitle}}</h1>
    <p class="rate-badge">Starting from {{roomStartingRate}}</p>
  </header>

  <section class="room-description">
    <h2>Room Overview</h2>
    <p>{{roomDescription}}</p>
  </section>

  <section class="room-features">
    <h2>Included Amenities</h2>
    <p>{{roomAmenities}}</p>
  </section>

  <section class="hotel-context">
    <h2>Stay at {{hotelName}}</h2>
    <p>All guests enjoy complimentary high-speed WiFi and on-site hospitality in {{cityName}}.</p>
  </section>
</article>
