<article class="hotel-faq">
  <header>
    <h1>{{hotelName}} — Frequently Asked Questions</h1>
    <p>Everything you need to know before visiting {{cityName}}.</p>
  </header>

  <section class="faq-list">
    <div class="faq-item">
      <h2>What is the check-in and check-out time?</h2>
      <p>{{checkInOutPolicy}}</p>
    </div>
    <div class="faq-item">
      <h2>Is parking available on-site?</h2>
      <p>{{parkingPolicy}}</p>
    </div>
    <div class="faq-item">
      <h2>Are pets allowed at {{hotelName}}?</h2>
      <p>{{petPolicy}}</p>
    </div>
  </section>
</article>
