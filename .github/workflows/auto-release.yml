name: Release Chrome Extension

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'chrome-extension/**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read extension version from manifest.json
        id: meta
        run: |
          VERSION=$(node -p "require('./chrome-extension/public/manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: check
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.meta.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.meta.outputs.version }} already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build & package extension
        if: steps.check.outputs.exists == 'false'
        run: |
          cd chrome-extension
          npm ci
          npm run build
          cd dist
          zip -r "$GITHUB_WORKSPACE/cogwheel-seo-studio.zip" .

      - name: Publish GitHub Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: SEO Studio GEO Studio v${{ steps.meta.outputs.version }}
          files: cogwheel-seo-studio.zip
          generate_release_notes: true
