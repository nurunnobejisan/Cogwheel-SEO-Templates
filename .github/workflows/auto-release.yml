name: Auto-Build & Release Chrome Extension

on:
  push:
    branches:
      - main
    paths:
      - 'manifest.json'
      - 'src/**'
      - 'chrome-extension/**'
      - 'data/**'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Extension
        run: |
          if [ -d "chrome-extension" ]; then
            cd chrome-extension
            npm ci
            npm run build
            cd dist
            zip -r ../../cogwheel-seo-studio.zip .
            cd ../..
          else
            npm ci
            npm run build
            cd dist
            zip -r ../cogwheel-seo-studio.zip .
            cd ..
          fi

      - name: Read Extension Version from manifest.json
        id: meta
        run: |
          if [ -f "./manifest.json" ]; then
            VERSION=$(node -p "require('./manifest.json').version")
          else
            VERSION=$(node -p "require('./chrome-extension/public/manifest.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate Chrome updates.xml
        run: |
          cat <<EOF > updates.xml
          <?xml version='1.0' encoding='UTF-8'?>
          <gupdate xmlns='http://www.google.com/update2/response' protocol='2.0'>
            <app appid='cogwheelseostudioinspectorid0001'>
              <updatecheck codebase='https://github.com/jisan-razibmarketing/Cogwheel-SEO-Templates/releases/latest/download/cogwheel-seo-studio.zip' version='${{ steps.meta.outputs.version }}' />
            </app>
          </gupdate>
          EOF

      - name: Commit Updated updates.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates.xml
          git diff --staged --quiet || git commit -m "chore: update updates.xml to v${{ steps.meta.outputs.version }}"
          git push

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Cogwheel SEO GEO Studio v${{ steps.meta.outputs.version }}
          files: cogwheel-seo-studio.zip
          generate_release_notes: true
