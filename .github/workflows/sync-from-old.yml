name: Sync from old account

# Mirrors jisan-razibmarketing/Cogwheel-SEO-Templates into this repository
# (nurunnobejisan/Cogwheel-SEO-Templates).
#
# This file lives in SOURCE as well as TARGET so that a byte-exact mirror carries
# it across; the job below only actually runs in TARGET (see the `if:` guard).
#
# Fast-forward only:
#   * never deletes TARGET branches that SOURCE does not have
#   * never force-pushes over commits made directly in TARGET
# If a branch has diverged, the job fails and opens an issue instead.
#
# Requires the repository secret SYNC_TOKEN on TARGET: a fine-grained PAT with
# "Contents: Read and write" on TARGET. SOURCE is public, so reading it needs no
# token (if SOURCE is ever made private, also grant the token Contents:Read on
# SOURCE).

on:
  schedule:
    - cron: "0 * * * *" # every hour, on the hour (UTC)
  workflow_dispatch:

permissions:
  contents: write # push branches/tags using the token from checkout
  issues: write # open an issue when a branch diverges

concurrency:
  group: sync-from-old
  cancel-in-progress: false

env:
  SOURCE_REPO: jisan-razibmarketing/Cogwheel-SEO-Templates

jobs:
  sync:
    # TARGET only — in the SOURCE repo this workflow does nothing.
    if: github.repository == 'nurunnobejisan/Cogwheel-SEO-Templates'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TARGET (full history, push via SYNC_TOKEN)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Fetch TARGET and SOURCE refs
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          if ! git remote get-url source >/dev/null 2>&1; then
            git remote add source "https://github.com/${SOURCE_REPO}.git"
          fi
          git fetch --prune source '+refs/heads/*:refs/remotes/source/*' '+refs/tags/*:refs/tags/*'

      - name: Push SOURCE branches (fast-forward only) and tags
        id: push
        run: |
          set -uo pipefail
          pushed=""
          diverged=""
          for ref in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/source); do
            [ "$ref" = "HEAD" ] && continue
            src="refs/remotes/source/$ref"
            dst="refs/heads/$ref"
            if git show-ref --verify --quiet "refs/remotes/origin/$ref"; then
              # TARGET has the branch: only fast-forward it; never overwrite.
              if git merge-base --is-ancestor "refs/remotes/origin/$ref" "$src"; then
                if git push origin "$src:$dst"; then pushed="$pushed $ref"; else diverged="$diverged $ref"; fi
              else
                diverged="$diverged $ref"
              fi
            else
              # TARGET lacks the branch: create it.
              if git push origin "$src:$dst"; then pushed="$pushed $ref(new)"; else diverged="$diverged $ref"; fi
            fi
          done

          # Tags: add/update only — never delete.
          git push --tags origin || true

          echo "pushed=$pushed" >> "$GITHUB_OUTPUT"
          echo "diverged=$diverged" >> "$GITHUB_OUTPUT"
          echo "Pushed:$pushed"
          if [ -n "${diverged// /}" ]; then
            echo "::error::Diverged branches were not pushed:$diverged"
            exit 1
          fi

      - name: Open an issue if a branch diverged
        if: failure()
        uses: actions/github-script@v7
        env:
          DIVERGED: ${{ steps.push.outputs.diverged }}
          PUSHED: ${{ steps.push.outputs.pushed }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const diverged = (process.env.DIVERGED || "").trim() || "(unknown — see the job log)";
            const title = "⚠️ Sync from old account: TARGET diverged from SOURCE";
            const body = [
              "The scheduled sync could not fast-forward one or more branches, so it stopped rather than overwrite work made directly in this repository.",
              "",
              `**Diverged refs:** ${diverged}`,
              `**Pushed refs:** ${(process.env.PUSHED || "").trim() || "(none)"}`,
              `**Run:** ${runUrl}`,
              "",
              "Resolve by either:",
              "- merging the SOURCE changes in this repository by hand, or",
              "- confirming the direct commits here are intentional and closing this issue.",
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({ owner, repo, state: "open" });
            if (!existing.data.some((issue) => issue.title === title)) {
              await github.rest.issues.create({ owner, repo, title, body });
            }
