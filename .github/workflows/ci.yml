name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node · TypeScript · Next.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
      - name: Lint (next lint)
        run: npm run lint
      - name: Validate training data (governance gate)
        run: npm run train:validate
      - name: Unit tests (Vitest)
        run: npm test
      - name: SEO integrity linter (10 gates)
        run: npm run lint:seo
      - name: SEO engine tests (node:test)
        run: npm run test:seo
      - name: TypeScript integration tests (node:test)
        run: npm run test:ts
      - name: Brain provenance gate (fabrication rate must be 0)
        run: npm run brain:eval data/brain-gold.example.json
      - name: Production build (next build)
        run: npm run build
        env:
          # next build is the memory peak; give Node a firm heap ceiling so a
          # constrained runner cannot OOM near the default cap.
          NODE_OPTIONS: --max-old-space-size=4096

  python:
    name: Python · Analyzer & Generators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (ruff)
        run: |
          pip install ruff==0.17.6
          ruff check python/
      - name: Tests (pytest)
        run: pytest tests/python -q

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for committed credentials
        run: |
          if grep -rnE "(ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{35}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----)" \
              --include='*.ts' --include='*.tsx' --include='*.js' --include='*.py' --include='*.json' \
              src/ validators/ schemas/ exporters/ api/ python/ 2>/dev/null; then
            echo "::error::Potential committed secret detected"
            exit 1
          fi
          echo "No secrets detected."