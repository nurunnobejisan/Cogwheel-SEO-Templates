name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Tests that touch platform code expect the explicit simulated-data opt-in.
      ALLOW_SIMULATED_DATA: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate training data (governance gate)
        run: npm run train:validate

      - name: Unit tests (vitest)
        run: npm run test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Python tests (pytest)
        run: python -m pytest tests/python -q

      # Brain eval needs network + an optional LLM key; never block the build on it.
      - name: Brain eval (advisory)
        continue-on-error: true
        run: npm run brain:eval
