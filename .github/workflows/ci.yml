name: CI Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript-and-build:
    name: TypeScript, Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Type Check Root TypeScript (tsc --noEmit)
        run: npm run typecheck

      - name: Run ESLint (Zero Any Enforcement)
        run: npx eslint src/ tests/

      - name: Run Vitest Test Suite
        run: npm test

      - name: Run SEO Integrity & Node Test Suite
        run: npm run test:seo

      - name: Build Next.js Production Application
        run: npm run build

      - name: Install Extension Dependencies & Build Chrome Extension
        run: |
          cd chrome-extension
          npm ci
          npx tsc --noEmit
          npm run build

  python-quality-and-tests:
    name: Python Lint, Type Check & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Tooling & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pydantic pytest

      - name: Run Ruff Linter
        run: ruff check scripts/python/ python/ outputs/ tests/python/

      - name: Run Mypy Strict Type Check
        run: mypy scripts/python/ python/

      - name: Run Master Python Test Suite
        run: python tests/python/run_tests.py

      - name: Run Pytest Test Suite
        run: pytest tests/python/

  json-and-schema-validation:
    name: JSON Datasets & Schema Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pydantic
        run: pip install pydantic

      - name: Validate All JSON Files in data/ and schemas/
        run: |
          python -c '
          import json, sys
          from pathlib import Path

          failures = []
          for folder in ["data", "schemas"]:
              p = Path(folder)
              if not p.exists():
                  continue
              for jf in p.glob("*.json"):
                  try:
                      with open(jf, "r", encoding="utf-8") as f:
                          json.load(f)
                      print(f"[OK] {jf} is valid JSON")
                  except Exception as e:
                      print(f"[FAIL] {jf}: {e}", file=sys.stderr)
                      failures.append(str(jf))

          if failures:
              print(f"ERROR: {len(failures)} JSON file(s) failed validation.", file=sys.stderr)
              sys.exit(1)
          print("All JSON dataset and schema files passed syntax verification.")
          '

      - name: Run Single Source of Truth Schema Validator
        run: python scripts/python/validate_schemas.py

  deploy-to-vercel:
    name: Auto-Deploy to Vercel Production
    runs-on: ubuntu-latest
    needs: [typescript-and-build, python-quality-and-tests, json-and-schema-validation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv for Python Serverless Functions
        uses: astral-sh/setup-uv@v5

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

