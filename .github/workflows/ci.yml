// CI workflow: lint (Ruff/Mypy/TSC), Vitest, Build & Auto-Release
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: TypeScript lint
        run: npx tsc --noEmit
      - name: Run Vitest
        run: npx vitest run
      - name: Build extension
        run: npm run build
      - name: Run Python lint & tests
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install -r python/requirements.txt
      - name: Ruff lint
        run: ruff check python
      - name: Mypy type check
        run: mypy python
      - name: Pytest
        run: pytest -q python
      - name: Generate audit summary
        run: npx ts-node scripts/generate-audit-summary.ts
      - name: Auto Release (optional)
        if: github.ref == 'refs/heads/main'
        run: npx ts-node scripts/git-auto-push.ts
