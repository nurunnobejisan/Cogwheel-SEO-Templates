name: Cogwheel SEO Integrity, TypeScript & Python CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  seo-integrity:
    name: Full-Stack SEO Integrity & Quality Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pydantic pytest

      - name: Secret Scan Verification
        run: |
          echo "Scanning codebase for exposed secrets and private credentials..."
          ! grep -rnE "(ghp_[a-zA-Z0-9]{20,}|sk-[a-zA-Z0-9]{20,}|AIza[0-9A-Za-z-_]{35})" src/ validators/ schemas/ exporters/ api/ 2>/dev/null

      - name: TypeScript Type Checking (tsc --noEmit)
        run: |
          npx tsc --noEmit

      - name: Run TypeScript Layer Tests (Vitest & Node test runner)
        run: |
          node --test --experimental-strip-types tests/ts/*.test.ts

      - name: Run Python Layer Tests (Pytest)
        run: |
          pytest tests/python/ -v

      - name: Run Master 10-Gate SEO Integrity Linter
        run: |
          node --experimental-strip-types tests/seoLinter.ts
