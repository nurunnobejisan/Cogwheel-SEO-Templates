name: SEO Integrity & Security CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  seo-integrity:
    name: SEO Quality & Security Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Secret Scan Verification
        run: |
          echo "Scanning codebase for exposed secrets and private keys..."
          ! grep -rnE "(ghp_[a-zA-Z0-9]{20,}|sk-[a-zA-Z0-9]{20,}|AIza[0-9A-Za-z-_]{35})" src/ validators/ schemas/ exporters/ 2>/dev/null

      - name: Run Master SEO Linter (10-Gate Validation)
        run: |
          node --experimental-strip-types tests/seoLinter.ts

      - name: Run Unit & Regression Test Suite
        run: |
          node --test --experimental-strip-types tests/variableResolver.test.ts
          node --test --experimental-strip-types tests/securityGuardrails.test.ts
          node --test --experimental-strip-types tests/schemas.test.ts
          node --test --experimental-strip-types tests/serpOptimizer.test.ts
          node --test --experimental-strip-types tests/uniquenessGate.test.ts
          node --test --experimental-strip-types tests/internalLinker.test.ts
          node --test --experimental-strip-types tests/exporters.test.ts
